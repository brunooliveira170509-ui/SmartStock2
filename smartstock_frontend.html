<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartStock | Gestão de estoque</title>
<style>
:root{--green:#087f73;--deep:#104f4a;--mint:#e8f6f3;--yellow:#f4a900;--ink:#20313a;--muted:#7a8a90;--line:#e5eceb;--bg:#f5f8f7;--white:#fff;--red:#e25c61;--shadow:0 10px 28px #183d3510}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}
.hidden{display:none!important}.app{min-height:100vh}.topbar{height:64px;background:var(--deep);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10;box-shadow:0 3px 12px #0001}.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.4px}.brand-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--yellow);color:var(--deep);font-weight:900;font-size:14px}.topnav{display:flex;align-items:center;gap:5px}.nav-btn{background:transparent;color:#c5d9d5;padding:10px 12px;border-radius:8px;font-size:12px;white-space:nowrap}.nav-btn:hover,.nav-btn.active{background:white;color:var(--deep);font-weight:700}.userarea{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:29px;height:29px;border-radius:50%;background:var(--yellow);color:var(--deep);display:grid;place-items:center;font-weight:800}.layout{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:220px;padding:22px 14px;background:#fff;border-right:1px solid var(--line);flex-shrink:0}.side-label{font-size:10px;color:#a1afaf;text-transform:uppercase;letter-spacing:1px;margin:0 10px 12px}.side-btn{width:100%;display:flex;gap:12px;align-items:center;padding:12px 13px;background:transparent;color:#71827f;border-radius:9px;text-align:left;margin-bottom:5px;font-size:13px}.side-btn .ico{width:20px;text-align:center;font-size:16px}.side-btn:hover,.side-btn.active{background:var(--mint);color:var(--green);font-weight:700}.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,42px)}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:7px}.page-head h1{font-size:25px;margin:0 0 6px;letter-spacing:-.7px}.subtitle{color:var(--muted);font-size:12px}.btn{border-radius:8px;padding:11px 15px;background:var(--green);color:white;font-weight:700;font-size:12px;box-shadow:0 4px 10px #087f7320}.btn:hover{background:#066b62}.btn.secondary{background:#fff;color:#4e6562;border:1px solid var(--line);box-shadow:none}.btn.yellow{background:var(--yellow);color:#3d330f}.btn.small{padding:8px 11px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:31px;height:31px;display:grid;place-items:center;background:var(--mint);border-radius:9px;color:var(--green)}.stat strong{display:block;font-size:25px;margin:13px 0 7px;letter-spacing:-.7px}.trend{font-size:11px;color:var(--green)}.trend.down{color:var(--red)}.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin-bottom:18px}.panel{padding:20px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.panel h2{font-size:14px;margin:0}.muted{color:var(--muted);font-size:11px}.chart{height:210px;display:flex;align-items:flex-end;gap:12px;padding:12px 5px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 49px,#edf2f1 50px)}.bar-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;min-width:0}.bar{width:min(30px,75%);background:#9ad8cd;border-radius:5px 5px 0 0;min-height:5px}.bar:nth-child(1){background:#c4e9e2}.bar-label{font-size:10px;color:var(--muted);padding-bottom:8px}.category-list{display:grid;gap:15px}.category-row{display:grid;grid-template-columns:90px 1fr 38px;gap:10px;align-items:center;font-size:11px}.track{height:7px;border-radius:20px;background:#edf2f1;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:20px}.fill.gold{background:var(--yellow)}.table-wrap{overflow:auto}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:15px;flex-wrap:wrap}.search{position:relative;min-width:220px;max-width:350px;flex:1}.search input{width:100%;padding:11px 12px 11px 35px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}.search span{position:absolute;left:12px;top:10px;color:#9aabaa}.filters{display:flex;gap:8px}.filters select,.field input,.field select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 11px;color:var(--ink);outline:none}.filters select{font-size:12px}.data-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}.data-table th{text-align:left;color:#8a9997;font-size:10px;text-transform:uppercase;letter-spacing:.45px;font-weight:700;background:#fafcfc;padding:13px 12px;border-bottom:1px solid var(--line)}.data-table td{padding:14px 12px;border-bottom:1px solid #edf1f0}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#fbfdfc}.product-name{font-weight:700}.product-sub{font-size:10px;color:var(--muted);margin-top:4px}.pill{display:inline-block;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:700;background:#e4f5ee;color:#148363}.pill.low{background:#fff4d9;color:#a47705}.pill.out{background:#ffebeb;color:#c94e56}.pill.in{background:#e8f6f3;color:#087f73}.pill.neutral{background:#edf1f0;color:#60716e}.table-foot{display:flex;justify-content:space-between;align-items:center;padding-top:15px;color:var(--muted);font-size:11px}.mov-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.move-box{display:flex;gap:13px;align-items:center;padding:17px;border:1px solid var(--line);border-radius:10px;background:#fff}.move-icon{width:38px;height:38px;border-radius:10px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-size:18px}.move-box strong{display:block;font-size:13px;margin-bottom:4px}.move-box span{font-size:11px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:7px;font-size:11px;color:#627572}.field input,.field select{width:100%;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}.notice{background:#fff5d9;border:1px solid #f4e5ae;color:#8d6b16;padding:11px 14px;border-radius:8px;font-size:11px;margin:15px 0}.report-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.report-kpi{background:#f7faf9;border-radius:9px;padding:15px}.report-kpi span{font-size:11px;color:var(--muted)}.report-kpi strong{display:block;font-size:19px;margin-top:8px}.settings-layout{display:grid;grid-template-columns:190px 1fr;gap:18px}.settings-menu{display:grid;gap:5px;align-content:start}.settings-menu button{background:transparent;text-align:left;padding:12px;border-radius:8px;color:#657875}.settings-menu button.active{background:var(--mint);color:var(--green);font-weight:700}.profile-row{display:flex;align-items:center;gap:14px;margin-bottom:20px}.profile-big{width:54px;height:54px;border-radius:50%;background:#ffe4a1;display:grid;place-items:center;color:#9b6900;font-weight:800;font-size:20px}.switch-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.switch{width:34px;height:19px;border-radius:20px;background:#cbd6d3;padding:2px;flex-shrink:0}.switch:after{content:"";display:block;width:15px;height:15px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(15px)}.login-screen{min-height:100vh;background:#f4f8f7;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}.login-screen:before,.login-screen:after{content:"";position:absolute;border-radius:50%;background:#0e6d63;opacity:.09}.login-screen:before{width:300px;height:300px;top:-130px;left:-90px}.login-screen:after{width:230px;height:230px;bottom:-130px;right:-40px}.login-card{width:min(100%,380px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:34px;box-shadow:0 20px 60px #164e4215;position:relative;z-index:1}.login-brand{justify-content:center;color:var(--deep);font-size:18px;margin-bottom:25px}.login-card h1{text-align:center;font-size:20px;margin:0 0 8px}.login-card .subtitle{text-align:center;margin-bottom:25px}.login-card .field{margin-bottom:14px}.login-card .btn{width:100%;margin-top:7px}.login-note{text-align:center;font-size:11px;color:var(--muted);margin-top:18px}.modal-backdrop{position:fixed;inset:0;background:#132a2a66;display:grid;place-items:center;padding:20px;z-index:30}.modal{background:#fff;width:min(100%,520px);border-radius:14px;padding:24px;box-shadow:0 25px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:18px}.close{background:transparent;color:#71827f;font-size:23px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:#164f49;color:white;padding:13px 18px;border-radius:9px;box-shadow:var(--shadow);z-index:50;font-size:12px}.mobile-menu{display:none}
@media(max-width:1050px){.topnav{gap:0}.nav-btn{padding:9px 7px;font-size:11px}.sidebar{width:190px}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.topbar{padding:0 16px;height:58px}.topnav{display:none}.mobile-menu{display:block;background:transparent;color:white;font-size:22px}.userarea .user-name{display:none}.layout{display:block}.sidebar{display:none;width:100%;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.sidebar.open{display:grid;grid-template-columns:1fr 1fr}.side-label{grid-column:1/-1}.main{padding:22px 15px}.page-head{align-items:flex-start}.page-head h1{font-size:22px}.cards{gap:10px}.stat{padding:14px}.stat strong{font-size:22px}.grid2{grid-template-columns:1fr}.mov-cards{grid-template-columns:1fr 1fr}.settings-layout{grid-template-columns:1fr}.settings-menu{display:flex;overflow:auto}.settings-menu button{white-space:nowrap}.report-kpis{grid-template-columns:1fr}.topbar .brand{font-size:14px}}
@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.stat-top{font-size:10px}.stat strong{font-size:20px}.mov-cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.page-head{flex-direction:column}.page-head .btn{align-self:stretch}.toolbar{align-items:stretch}.filters{width:100%}.filters select{flex:1;min-width:0}.login-card{padding:26px 22px}.category-row{grid-template-columns:75px 1fr 30px}.main{padding:18px 12px}}
</style>
</head>
<body>
<div id="login" class="login-screen">
  <form class="login-card" id="loginForm">
    <div class="brand login-brand"><span class="brand-mark">S</span> SmartStock</div>
    <h1>Acesse sua conta</h1><p class="subtitle">Controle de estoque inteligente para sua operação</p>
    <label class="field">E-mail<input type="email" id="email" placeholder="seuemail@empresa.com" required value="bruno@smartstock.com"></label>
    <label class="field">Senha<input type="password" id="password" placeholder="Sua senha" required value="123456"></label>
    <button class="btn" type="submit">Entrar no SmartStock →</button>
    <p class="login-note">Demonstração visual • use qualquer e-mail e senha</p>
  </form>
</div>
<div id="app" class="app hidden">
  <header class="topbar">
    <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button>
    <div class="brand"><span class="brand-mark">S</span> SmartStock</div>
    <nav class="topnav" id="topnav"></nav>
    <div class="userarea"><span class="user-name">Bruno da Silva</span><span class="avatar">B</span></div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"><div class="side-label">Menu principal</div><div id="sideNav"></div></aside>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const navItems=[
 {id:'dashboard',label:'Painel',icon:'▦'},
 {id:'products',label:'Produtos',icon:'▤'},
 {id:'movements',label:'Movimentações',icon:'⇄'},
 {id:'reports',label:'Relatórios',icon:'▥'},
 {id:'settings',label:'Configurações',icon:'⚙'}
];
let current='dashboard',settingsTab='Perfil';
let products=[
 {code:'P-001',name:'Café em grãos 250g',category:'Alimentos',stock:42,min:10,price:28.9,status:'Em estoque'},
 {code:'P-002',name:'Pasta de amendoim 500g',category:'Alimentos',stock:18,min:8,price:24.5,status:'Em estoque'},
 {code:'P-003',name:'Suco natural 1L',category:'Bebidas',stock:7,min:12,price:12.9,status:'Estoque baixo'},
 {code:'P-004',name:'Vela aromática',category:'Casa',stock:31,min:8,price:39.9,status:'Em estoque'},
 {code:'P-005',name:'Granola tradicional 300g',category:'Alimentos',stock:5,min:10,price:19.9,status:'Estoque baixo'},
 {code:'P-006',name:'Sabonete vegetal',category:'Higiene',stock:0,min:10,price:8.5,status:'Sem estoque'},
 {code:'P-007',name:'Chá verde 20 sachês',category:'Bebidas',stock:24,min:8,price:16.9,status:'Em estoque'},
 {code:'P-008',name:'Caneca cerâmica',category:'Casa',stock:14,min:5,price:32,status:'Em estoque'}
];
let movements=[
 {date:'25/11/2026',name:'Café em grãos 250g',type:'Entrada',qty:20,person:'Bruno Silva'},
 {date:'25/11/2026',name:'Suco natural 1L',type:'Saída',qty:5,person:'Ana Costa'},
 {date:'24/11/2026',name:'Pasta de amendoim 500g',type:'Entrada',qty:12,person:'Bruno Silva'},
 {date:'24/11/2026',name:'Granola tradicional 300g',type:'Saída',qty:4,person:'Ana Costa'},
 {date:'23/11/2026',name:'Vela aromática',type:'Entrada',qty:10,person:'Bruno Silva'}
];
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const navButton=(n,side=false)=>`<button class="${side?'side-btn':'nav-btn'} ${current===n.id?'active':''}" data-page="${n.id}">${side?`<span class="ico">${n.icon}</span>`:''}${n.label}</button>`;
function renderNav(){document.getElementById('topnav').innerHTML=navItems.map(n=>navButton(n)).join('');document.getElementById('sideNav').innerHTML=navItems.map(n=>navButton(n,true)).join('');}
function go(page){current=page;renderNav();renderPage();document.getElementById('sidebar').classList.remove('open');}
function head(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">SMARTSTOCK / ${title.toUpperCase()}</div><h1>${title}</h1><div class="subtitle">${sub}</div></div>${action}</div>`}
function stat(label,value,icon,trend,down=false){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><strong>${value}</strong><div class="trend ${down?'down':''}">${trend}</div></div>`}
function productStatus(p){return p.stock===0?'Sem estoque':p.stock<=p.min?'Estoque baixo':'Em estoque'}
function pill(status){let c=status==='Em estoque'?'':status==='Estoque baixo'?'low':status==='Sem estoque'?'out':status==='Entrada'?'in':'neutral';return `<span class="pill ${c}">${status}</span>`}
function tableProducts(rows=products){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Preço un.</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td>${p.code}</td><td><div class="product-name">${p.name}</div><div class="product-sub">Atualizado recentemente</div></td><td>${p.category}</td><td>${p.stock} un.</td><td>${money(p.price)}</td><td>${pill(productStatus(p))}</td><td><button class="btn secondary small" onclick="editProduct('${p.code}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){let total=products.reduce((a,p)=>a+p.stock,0),value=products.reduce((a,p)=>a+p.stock*p.price,0),low=products.filter(p=>p.stock<=p.min).length;return `${head('Painel','Olá, Bruno. Aqui está o resumo da sua operação hoje.','<button class="btn yellow" onclick="openProductModal()">+ Novo produto</button>')}<div class="cards">${stat('Produtos cadastrados',products.length,'▤','↑ 8% neste mês')}${stat('Valor em estoque',money(value),'◈','↑ 12,4% neste mês')}${stat('Itens com estoque baixo',low,'⚑','Precisam de atenção',true)}${stat('Giro de estoque','1,8x','↻','↑ 0,3x em relação ao mês passado')}</div><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Saídas por categoria (novembro)</h2><span class="muted">Volume de itens movimentados</span></div><span class="muted">Este mês⌄</span></div><div class="category-list">${[['Alimentos',84],['Bebidas',67],['Higiene',48],['Casa',35],['Acessórios',22]].map((x,i)=>`<div class="category-row"><span>${x[0]}</span><div class="track"><div class="fill ${i===4?'gold':''}" style="width:${x[1]}%"></div></div><b>${x[1]}%</b></div>`).join('')}</div><div class="notice">↑ 1.486 unidades movimentadas neste mês</div></section><section class="panel"><div class="panel-head"><div><h2>Precisam de reposição</h2><span class="muted">Produtos abaixo do mínimo</span></div><button class="btn secondary small" onclick="go('products')">Ver todos</button></div>${products.filter(p=>p.stock<=p.min).slice(0,4).map(p=>`<div class="move-box" style="margin-bottom:9px;padding:11px"><div class="move-icon">▤</div><div style="flex:1"><strong>${p.name}</strong><span>${p.stock} unidades disponíveis</span></div>${pill(p.stock===0?'Sem estoque':'Repor')}</div>`).join('')||'<p class="muted">Tudo em dia por aqui.</p>'}</section></div><section class="panel"><div class="panel-head"><h2>Movimentações recentes</h2><button class="btn secondary small" onclick="go('movements')">Ver movimentações</button></div>${tableMovements(movements.slice(0,4))}</section>`}
function productsPage(){return `${head('Produtos','Gerencie seu catálogo e acompanhe os níveis de estoque.','<button class="btn" onclick="openProductModal()">+ Novo produto</button>')}<section class="panel"><div class="toolbar"><label class="search"><span>⌕</span><input id="productSearch" placeholder="Buscar produto ou código..."></label><div class="filters"><select id="categoryFilter"><option value="">Todas categorias</option><option>Alimentos</option><option>Bebidas</option><option>Casa</option><option>Higiene</option><option>Acessórios</option></select><select id="statusFilter"><option value="">Todos status</option><option>Em estoque</option><option>Estoque baixo</option><option>Sem estoque</option></select></div></div><div id="productTable">${tableProducts()}</div><div class="table-foot"><span id="productCount">${products.length} produtos cadastrados</span><span>Mostrando todos os produtos</span></div></section>`}
function tableMovements(rows){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Responsável</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${m.date}</td><td><div class="product-name">${m.name}</div></td><td>${pill(m.type)}</td><td><b>${m.type==='Entrada'?'+':'−'}${m.qty}</b></td><td>${m.person}</td></tr>`).join('')}</tbody></table></div>`}
function movementsPage(){return `${head('Movimentações','Registre entradas e saídas para manter o estoque atualizado.','<button class="btn" onclick="openMovementModal()">+ Nova movimentação</button>')}<div class="mov-cards"><div class="move-box"><div class="move-icon">↘</div><div><strong>Registrar entrada</strong><span>Adicione unidades recebidas ao estoque.</span></div><button class="btn secondary small" onclick="openMovementModal('Entrada')">Adicionar</button></div><div class="move-box"><div class="move-icon" style="background:#fff4d9;color:#a47705">↗</div><div><strong>Registrar saída</strong><span>Registre vendas, uso ou perdas.</span></div><button class="btn secondary small" onclick="openMovementModal('Saída')">Registrar</button></div></div><section class="panel"><div class="panel-head"><div><h2>Histórico de movimentações</h2><span class="muted">Últimas atividades do estoque</span></div><select class="filters" id="movementFilter" style="padding:9px;border:1px solid var(--line);border-radius:8px"><option value="">Todas</option><option>Entrada</option><option>Saída</option></select></div><div id="movementTable">${tableMovements(movements)}</div></section>`}
function reportsPage(){let value=products.reduce((a,p)=>a+p.stock*p.price,0);return `${head('Relatórios','Acompanhe o desempenho e os indicadores do seu estoque.','<button class="btn secondary" onclick="window.print()">⇩ Exportar relatório</button>')}<div class="cards">${stat('Valor total em estoque',money(value),'◈','Valor estimado atual')}${stat('Entradas no mês','428','↘','↑ 14% vs. mês anterior')}${stat('Saídas no mês','312','↗','↓ 4% vs. mês anterior')}${stat('Produtos ativos',products.filter(p=>p.stock>0).length,'▤','Itens com saldo positivo')}</div><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Movimentações no período</h2><span class="muted">Entradas e saídas por semana</span></div><select class="filters"><option>Últimos 30 dias</option><option>Este ano</option></select></div><div class="chart">${[65,42,78,58,90,70,83].map((h,i)=>`<div class="bar-col"><div style="display:flex;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center"><div class="bar" style="height:${h}%;background:#a8dcd2"></div><div class="bar" style="height:${Math.max(12,h-23)}%;background:#087f73"></div></div><span class="bar-label">${['S1','S2','S3','S4','S5','S6','S7'][i]}</span></div>`).join('')}</div><div class="muted" style="margin-top:12px">■ Entradas &nbsp; <span style="color:var(--green)">■</span> Saídas</div></section><section class="panel"><div class="panel-head"><h2>Estoque por categoria</h2><span class="muted">Distribuição atual</span></div><div class="category-list">${[['Alimentos',72],['Bebidas',54],['Casa',43],['Higiene',28],['Acessórios',17]].map((x,i)=>`<div class="category-row"><span>${x[0]}</span><div class="track"><div class="fill ${i===4?'gold':''}" style="width:${x[1]}%"></div></div><b>${x[1]}%</b></div>`).join('')}</div></section></div><section class="panel"><div class="panel-head"><h2>Resumo de produtos</h2><button class="btn secondary small" onclick="go('products')">Abrir produtos</button></div>${tableProducts(products.slice(0,5))}</section>`}
function settingsPage(){return `${head('Configurações','Personalize sua conta e as preferências do sistema.')}<div class="settings-layout"><div class="panel settings-menu">${['Perfil','Empresa','Equipe','Alertas','Integrações'].map(t=>`<button class="${settingsTab===t?'active':''}" onclick="settingsTab='${t}';renderPage()">${t}</button>`).join('')}</div><section class="panel"><div class="panel-head"><div><h2>${settingsTab}</h2><span class="muted">Gerencie suas informações e preferências</span></div></div>${settingsTab==='Perfil'?`<div class="profile-row"><div class="profile-big">BO</div><div><b>Bruno Oliveira</b><div class="muted">Administrador</div><button class="btn secondary small" style="margin-top:8px" onclick="toast('Foto de perfil: demonstração')">Trocar foto</button></div></div><div class="form-grid"><label class="field">Nome completo<input value="Bruno Oliveira"></label><label class="field">Cargo<input value="Administrador"></label><label class="field">E-mail<input value="bruno@smartstock.com"></label><label class="field">Telefone<input value="(11) 99999-9999"></label></div><h2 style="margin-top:25px">Preferências de notificação</h2>${[['Alertas de reposição','Receba avisos quando um produto atingir o mínimo.'],['Resumo por e-mail','Receba um resumo semanal de estoque.'],['Avisos de movimentação','Notificações sobre entradas e saídas.']].map((x,i)=>`<div class="switch-row"><div><b>${x[0]}</b><div class="muted" style="margin-top:4px">${x[1]}</div></div><button class="switch ${i!==1?'on':''}" onclick="this.classList.toggle('on')" aria-label="Alternar preferência"></button></div>`).join('')}`:`<div class="form-grid"><label class="field">Nome<input value="SmartStock Comércio"></label><label class="field">CNPJ<input placeholder="00.000.000/0001-00"></label><label class="field">E-mail de contato<input value="contato@smartstock.com"></label><label class="field">Fuso horário<select><option>Brasília (GMT-3)</option></select></label></div><div class="notice">Esta seção é uma demonstração visual. As alterações não são salvas.</div>`}<div style="display:flex;justify-content:flex-end;margin-top:22px"><button class="btn" onclick="toast('Preferências salvas nesta demonstração')">Salvar alterações</button></div></section></div>`}
function renderPage(){let html={dashboard,products:productsPage,movements:movementsPage,reports:reportsPage,settings:settingsPage}[current]();document.getElementById('main').innerHTML=html;wirePage()}
function wirePage(){let s=document.getElementById('productSearch');if(s)s.addEventListener('input',filterProducts);let c=document.getElementById('categoryFilter');if(c)c.addEventListener('change',filterProducts);let st=document.getElementById('statusFilter');if(st)st.addEventListener('change',filterProducts);let mf=document.getElementById('movementFilter');if(mf)mf.addEventListener('change',()=>{let rows=mf.value?movements.filter(m=>m.type===mf.value):movements;document.getElementById('movementTable').innerHTML=tableMovements(rows)})}
function filterProducts(){let q=(document.getElementById('productSearch')?.value||'').toLowerCase(),cat=document.getElementById('categoryFilter')?.value||'',status=document.getElementById('statusFilter')?.value||'';let rows=products.filter(p=>(p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q))&&(!cat||p.category===cat)&&(!status||productStatus(p)===status));document.getElementById('productTable').innerHTML=tableProducts(rows);document.getElementById('productCount').textContent=`${rows.length} produto(s) encontrado(s)`}
function openProductModal(code=''){let p=products.find(x=>x.code===code);document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${p?'Editar produto':'Novo produto'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="productForm"><div class="form-grid"><label class="field full">Nome do produto<input name="name" required value="${p?.name||''}" placeholder="Ex.: Café em grãos 250g"></label><label class="field">Categoria<select name="category"><option ${p?.category==='Alimentos'?'selected':''}>Alimentos</option><option ${p?.category==='Bebidas'?'selected':''}>Bebidas</option><option ${p?.category==='Casa'?'selected':''}>Casa</option><option ${p?.category==='Higiene'?'selected':''}>Higiene</option><option>Acessórios</option></select></label><label class="field">Preço unitário (R$)<input name="price" type="number" min="0" step=".01" required value="${p?.price??''}"></label><label class="field">Quantidade em estoque<input name="stock" type="number" min="0" required value="${p?.stock??0}"></label><label class="field">Estoque mínimo<input name="min" type="number" min="0" required value="${p?.min??5}"></label></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" type="submit">Salvar produto</button></div></form></div></div>`;document.getElementById('productForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(p)Object.assign(p,{name:d.name,category:d.category,price:+d.price,stock:+d.stock,min:+d.min});else products.unshift({code:'P-'+String(Math.max(...products.map(x=>+x.code.slice(2)))+1).padStart(3,'0'),name:d.name,category:d.category,price:+d.price,stock:+d.stock,min:+d.min});closeModal();renderPage();toast('Produto salvo com sucesso')}}
function editProduct(code){openProductModal(code)}
function openMovementModal(type='Entrada'){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>Nova movimentação</h2><button class="close" onclick="closeModal()">×</button></div><form id="movementForm"><div class="form-grid"><label class="field full">Produto<select name="code" required>${products.map(p=>`<option value="${p.code}">${p.name} (${p.stock} un.)</option>`).join('')}</select></label><label class="field">Tipo<select name="type"><option ${type==='Entrada'?'selected':''}>Entrada</option><option ${type==='Saída'?'selected':''}>Saída</option></select></label><label class="field">Quantidade<input name="qty" type="number" min="1" required value="1"></label><label class="field full">Responsável<input name="person" value="Bruno Silva" required></label></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" type="submit">Confirmar movimentação</button></div></form></div></div>`;document.getElementById('movementForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),p=products.find(p=>p.code===d.code),qty=+d.qty;if(d.type==='Saída'&&qty>p.stock){toast('Quantidade maior que o estoque disponível');return}p.stock+=d.type==='Entrada'?qty:-qty;movements.unshift({date:new Date().toLocaleDateString('pt-BR'),name:p.name,type:d.type,qty,person:d.person});closeModal();renderPage();toast('Movimentação registrada')}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){let r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>r.innerHTML='',2600)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderNav();go('dashboard')};
document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
</script>
</body>
</html>
